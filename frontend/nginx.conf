server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # resolve 'api' through Docker DNS at request time, not nginx startup,
        # so the proxy survives the api container being recreated
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
